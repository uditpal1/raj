/* ============================================================
   CONFIG
   ============================================================ */
const subjectNames = {
  rajasthan_gk: "Rajasthan GK",
  current_affairs: "Current Affairs",
  india_gk: "India GK",
  reasoning: "Reasoning",
  maths: "Maths",
  hindi: "Hindi"
};

const subjectColors = {
  rajasthan_gk: "#d97706",
  current_affairs: "#dc2626",
  india_gk: "#16a34a",
  reasoning: "#c1440e",
  maths: "#2563eb",
  hindi: "#9333ea"
};

/* ============================================================
   RENDERING LOGIC
   ============================================================ */
function formatQuestion(q) {
  let text = `Q${q.qno}. ${q.hindi}\n${q.english}\n`;
  const labels = ["A", "B", "C", "D"];
  q.options.forEach((opt, i) => {
    const tick = opt.correct ? " ✓" : "";
    text += `${labels[i]}) ${opt.hi} / ${opt.en}${tick}\n`;
  });
  return text.trim();
}

function getFiltered() {
  const subject = document.getElementById('subjectFilter').value;
  const day = document.getElementById('dayFilter').value;
  const search = document.getElementById('searchBox').value.trim().toLowerCase();

  return questions.filter(q => {
    if (subject !== 'all' && q.subject !== subject) return false;
    if (day !== 'all' && String(q.day) !== day) return false;
    if (search) {
      const hay = (q.hindi + " " + q.english + " " +
        q.options.map(o => o.hi + " " + o.en).join(" ")).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  document.getElementById('stats').textContent =
    `Showing ${filtered.length} of ${questions.length} questions`;

  if (filtered.length === 0) {
    container.innerHTML = '<p class="empty-msg">😕 No questions found. Filter change karke dekho.</p>';
    return;
  }

  filtered.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.style.borderLeftColor = subjectColors[q.subject] || '#c1440e';

    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `
      <span class="q-tag">Q${q.qno}</span>
      <span class="subject-tag" style="background:${subjectColors[q.subject]}18;color:${subjectColors[q.subject]};">
        ${subjectNames[q.subject]} • Day ${q.day}
      </span>
    `;

    const ta = document.createElement('textarea');
    ta.id = `q-${idx}`;
    ta.value = formatQuestion(q);
    ta.readOnly = true;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Copy';
    btn.onclick = () => {
      ta.select();
      document.execCommand('copy');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ta.value).catch(() => {});
      }
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Copy';
        btn.classList.remove('copied');
      }, 1500);
    };

    card.appendChild(header);
    card.appendChild(ta);
    card.appendChild(btn);
    container.appendChild(card);
  });
}

function copyAll() {
  const filtered = getFiltered();
  if (filtered.length === 0) { alert('Koi question visible nahi hai.'); return; }
  const all = filtered.map(formatQuestion).join('\n\n---\n\n');
  navigator.clipboard.writeText(all).then(() => {
    alert(`✅ ${filtered.length} questions clipboard mein copy ho gaye!`);
  }).catch(() => {
    alert('Copy nahi ho paya. Browser permission check karo.');
  });
}

function downloadJSON() {
  const dataStr = JSON.stringify(questions, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rajasthan-jobs-questions.json';
  a.click();
  URL.revokeObjectURL(url);
}

function populateDays() {
  const days = [...new Set(questions.map(q => q.day))].sort((a,b)=>a-b);
  const sel = document.getElementById('dayFilter');
  days.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = `Day ${d}`;
    sel.appendChild(opt);
  });
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
document.getElementById('subjectFilter').addEventListener('change', render);
document.getElementById('dayFilter').addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);

/* ============================================================
   INIT
   ============================================================ */
populateDays();
render();
</script>
